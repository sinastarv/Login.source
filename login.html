<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Tahoma, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
    }

    .c1 { width: 300px; height: 300px; top: -80px; right: -80px; }
    .c2 { width: 200px; height: 200px; bottom: -60px; left: -40px; background: rgba(255, 255, 255, 0.2); }
    .c3 { width: 120px; height: 120px; top: 55%; right: 12%; background: rgba(255, 255, 255, 0.1); }

    .login-box {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.95);
      padding: 36px 32px;
      width: 100%;
      max-width: 380px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .avatar {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar svg { width: 30px; height: 30px; fill: #fff; }

    h2 {
      text-align: center;
      color: #2d2a4a;
      margin-bottom: 4px;
    }

    .sub {
      text-align: center;
      font-size: 13px;
      color: #8a87a3;
      margin-bottom: 28px;
    }

    .field {
      position: relative;
      margin-bottom: 18px;
    }

    .field svg {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: #a5a2c0;
    }

    input {
      width: 100%;
      padding: 13px 44px 13px 14px;
      border: 2px solid #e6e4f2;
      border-radius: 12px;
      font-size: 14px;
      background: #f7f6fd;
      transition: all 0.2s;
    }

    input:focus {
      outline: none;
      border-color: #764ba2;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.15);
    }

    .forgot {
      display: block;
      text-align: left;
      font-size: 12px;
      color: #764ba2;
      text-decoration: none;
      margin: -6px 0 20px;
    }

    button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(118, 75, 162, 0.4);
    }
  </style>
</head>
<body>
  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <div class="circle c3"></div>

  <form class="login-box" action="#" method="post">
    <div class="avatar">
      <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5z"/></svg>
    </div>
    <h2>خوش آمدید</h2>
    <p class="sub">برای ادامه وارد حساب خود شوید</p>

    <div class="field">
      <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5z"/></svg>
      <input type="text" name="username" placeholder="نام کاربری" required>
    </div>

    <div class="field">
      <svg viewBox="0 0 24 24"><path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6z"/></svg>
      <input type="password" name="password" placeholder="رمز عبور" required>
    </div>

    <a href="#" class="forgot">رمز عبور را فراموش کرده‌اید؟</a>

    <button type="submit">ورود</button>
  </form>
</body>
</html>
